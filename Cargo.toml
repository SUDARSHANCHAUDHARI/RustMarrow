[package]
name = "rustmarrow"
version = "1.1.1"
edition = "2021"
authors = ["Sudarshan Chaudhari <sunny.sudarshan@gmail.com>"]
description = "Personal local AI memory agent"
license = "MIT"
repository = "https://github.com/SUDARSHANCHAUDHARI/RustMarrow"
readme = "README.md"
keywords = ["memory", "agent", "sqlite", "cli", "local"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "rustmarrow"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
# 0.13 renamed "rustls-tls" to "rustls" and split ".form()" out into its own feature
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
base64 = "0.23"
urlencoding = "2"
